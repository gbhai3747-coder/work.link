<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work.link | Book Service</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="page-header">
    <nav class="navbar">
      <a class="brand" href="index.html">WORKLINK.COM</a>
      <ul class="nav-links">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="workers.html">Workers</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a class="button button-secondary" href="login.html">Login</a>
        <a class="button button-primary" href="register.html">Register</a>
      </div>
    </nav>
  </header>

  <main class="section booking-section">
    <div class="section-header">
      <p class="eyebrow">Book service</p>
      <h2>Request a booking</h2>
      <p class="section-copy">Fill in the details and submit your booking request to the selected worker.</p>
    </div>

    <div class="booking-grid">
      <form id="booking-form" class="booking-form">
        <div class="form-group">
          <label for="booking-service">Service</label>
          <input id="booking-service" type="text" disabled />
        </div>
        <div class="form-group">
          <label for="booking-worker">Worker</label>
          <input id="booking-worker" type="text" disabled />
        </div>
        <div class="form-group">
          <label for="booking-date">Date</label>
          <input id="booking-date" type="date" required />
        </div>
        <div class="form-group">
          <label for="booking-time">Time</label>
          <input id="booking-time" type="time" required />
        </div>
        <div class="form-group">
          <label for="booking-address">Address</label>
          <input id="booking-address" type="text" placeholder="Your full address" required />
        </div>
        <div class="form-group form-full">
          <label for="booking-description">Description</label>
          <textarea id="booking-description" rows="4" placeholder="Describe the work needed" required></textarea>
        </div>
        <div class="message" id="booking-message"></div>
        <button type="submit" class="button button-primary">Submit booking</button>
      </form>

      <aside class="booking-summary-card">
        <h3>Booking summary</h3>
        <p id="summary-text">Choose a worker from the profile page to pre-fill this booking form.</p>
      </aside>
    </div>
  </main>

  <script src="js/workers-data.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/auth-ui.js"></script>
</body>
</html>
