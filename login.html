<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work.link | Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-header">
        <p class="eyebrow">Welcome back</p>
        <h1>Login to Work.link</h1>
        <p class="section-copy">Enter your email and password to continue. If you are new, register for free.</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" required minlength="6" />
        </div>
        <div class="message" id="login-message"></div>
        <button type="submit" class="button button-primary">Login</button>
      </form>

      <p class="auth-footer">New to Work.link? <a href="register.html">Create an account</a></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
</body>
</html>
