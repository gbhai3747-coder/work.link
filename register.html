<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work.link | Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-header">
        <p class="eyebrow">Create account</p>
        <h1>Register on Work.link</h1>
        <p class="section-copy">Sign up as a customer or worker and start booking or accepting jobs.</p>
      </div>

      <form id="register-form" class="auth-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="register-name">Name</label>
            <input id="register-name" type="text" placeholder="Your full name" required />
          </div>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input id="register-email" type="email" placeholder="name@example.com" required />
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input id="register-password" type="password" placeholder="••••••••" required minlength="6" />
          </div>
          <div class="form-group">
            <label for="register-phone">Phone</label>
            <input id="register-phone" type="tel" placeholder="9876543210" required />
          </div>
          <div class="form-group">
            <label for="register-location">Location</label>
            <input id="register-location" type="text" placeholder="Your city or area" required />
          </div>
          <div class="form-group">
            <label for="register-role">Account type</label>
            <select id="register-role" required>
              <option value="customer">Customer</option>
              <option value="worker">Worker</option>
            </select>
          </div>
        </div>

        <div class="message" id="register-message"></div>
        <button type="submit" class="button button-primary">Register</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
</body>
</html>
