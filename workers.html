<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work.link | Workers</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="page-header">
    <nav class="navbar">
      <a class="brand" href="index.html">WORKLINK.COM</a>
      <ul class="nav-links">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="workers.html">Workers</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a class="button button-secondary" href="login.html">Login</a>
        <a class="button button-primary" href="register.html">Register</a>
      </div>
    </nav>
  </header>

  <main class="section">
    <div class="section-header">
      <p class="eyebrow">Available workers</p>
      <h2>Browse local professionals</h2>
      <p class="section-copy">Filter by service, location, rating, price, and availability to find the right worker near you.</p>
    </div>

    <div class="filters-row">
      <select id="filter-service">
        <option value="">All services</option>
      </select>
      <select id="filter-location">
        <option value="">All locations</option>
      </select>
      <select id="filter-rating">
        <option value="">Any rating</option>
        <option value="4.5">4.5+</option>
        <option value="4.0">4.0+</option>
        <option value="3.5">3.5+</option>
      </select>
      <select id="filter-price">
        <option value="">Any price</option>
        <option value="300">Under ₹400</option>
        <option value="500">Under ₹600</option>
        <option value="800">Under ₹900</option>
      </select>
      <select id="filter-availability">
        <option value="">Any availability</option>
        <option value="today">Available today</option>
        <option value="tomorrow">Available tomorrow</option>
        <option value="week">This week</option>
      </select>
    </div>

    <div id="workers-list" class="workers-grid"></div>
  </main>

  <script src="js/workers-data.js"></script>
  <script src="js/workers.js"></script>
  <script src="js/auth-ui.js"></script>
</body>
</html>
